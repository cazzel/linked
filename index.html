<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10233f" />
  <title>LINKED — Peer Learning</title>
  <style>
    :root {
      --navy: #10233f;
      --navy2: #19365b;
      --blue: #3f72e5;
      --blue-soft: #edf3ff;
      --cyan: #5bd6d1;
      --ink: #1b2940;
      --muted: #758198;
      --line: #e6ebf2;
      --bg: #f6f8fc;
      --white: #fff;
      --green: #168567;
      --green-soft: #e6f7f1;
      --amber: #a76a12;
      --amber-soft: #fff3df;
      --red: #b84153;
      --red-soft: #fff0f1;
      --shadow: 0 10px 30px rgba(19, 41, 75, .06);
      --radius: 18px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink)
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 252px;
      background: var(--navy);
      color: #dce8fb;
      padding: 25px 16px;
      display: flex;
      flex-direction: column;
      z-index: 10
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 12px 29px
    }

    .brand-mark {
      width: 39px;
      height: 39px;
      border-radius: 13px;
      background: linear-gradient(145deg, #65e1d7, #56a5f5);
      display: grid;
      place-items: center;
      color: #10233f;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 8px 20px #07172d55
    }

    .brand-name {
      font-size: 21px;
      font-weight: 850;
      letter-spacing: .08em;
      color: #fff
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: .09em;
      color: #9db5d5;
      margin-top: 3px
    }

    .nav-label {
      padding: 13px 13px 9px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .16em;
      color: #7591b7;
      text-transform: uppercase
    }

    .nav {
      display: grid;
      gap: 5px
    }

    .nav-btn {
      height: 45px;
      border: 0;
      background: transparent;
      border-radius: 12px;
      color: #b7c7de;
      text-align: left;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 13px;
      transition: .15s
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      opacity: .85
    }

    .nav-btn:hover {
      background: #ffffff0c;
      color: white
    }

    .nav-btn.active {
      background: #2c4770;
      color: white;
      box-shadow: inset 3px 0 #62d8d0
    }

    .nav-count {
      margin-left: auto;
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 10px;
      background: #314f79;
      color: #e8f3ff
    }

    .sidebar-bottom {
      margin-top: auto
    }

    .pilot-card {
      margin: 20px 5px 12px;
      padding: 15px;
      border: 1px solid #2c4567;
      border-radius: 14px;
      background: #142b4c
    }

    .pilot-card .pilot-title {
      font-size: 11px;
      font-weight: 800;
      color: white;
      margin-bottom: 6px
    }

    .pilot-card p {
      font-size: 10px;
      line-height: 1.65;
      color: #a9bdd8;
      margin: 0 0 10px
    }

    .pilot-pill {
      font-size: 9px;
      display: inline-flex;
      gap: 5px;
      align-items: center;
      color: #83e3d7;
      background: #1a4660;
      padding: 5px 8px;
      border-radius: 7px;
      font-weight: 800
    }

    .user-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 8px 0;
      border-top: 1px solid #29405f
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      font-size: 12px;
      font-weight: 800;
      color: #264776;
      background: #dce9ff
    }

    .avatar.teal {
      background: #d7f6f0;
      color: #126a61
    }

    .avatar.pink {
      background: #fae0ed;
      color: #9b3765
    }

    .avatar.gold {
      background: #ffebc7;
      color: #956017
    }

    .avatar.violet {
      background: #e8e0ff;
      color: #6543a6
    }

    .mini-info {
      min-width: 0
    }

    .mini-name {
      font-weight: 700;
      color: white;
      font-size: 12px
    }

    .mini-role {
      font-size: 10px;
      color: #92a9c9;
      margin-top: 3px
    }

    .main {
      width: calc(100% - 252px);
      margin-left: 252px;
      min-width: 0
    }

    .topbar {
      height: 78px;
      background: #ffffffd9;
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      position: sticky;
      top: 0;
      z-index: 5
    }

    .crumb {
      font-size: 12px;
      color: var(--muted)
    }

    .crumb strong {
      color: var(--ink);
      font-weight: 800
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .demo-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 9px;
      color: #5b6a80;
      background: #f0f3f8;
      font-weight: 700;
      font-size: 10px
    }

    .demo-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e5a23c
    }

    .mode-switch {
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 9px 12px;
      color: #42536e;
      font-weight: 700;
      font-size: 11px
    }

    .icon-btn {
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: white;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: #65758e
    }

    .top-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #dce9ff;
      color: #2455a0;
      font-size: 11px;
      font-weight: 900
    }

    .content {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 34px 54px
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 25px
    }

    .eyebrow {
      color: var(--blue);
      font-weight: 850;
      letter-spacing: .13em;
      text-transform: uppercase;
      font-size: 10px;
      margin-bottom: 9px
    }

    .page-head h1 {
      font-size: 27px;
      letter-spacing: -.045em;
      margin: 0;
      color: #162842;
      font-weight: 850
    }

    .page-head p {
      font-size: 13px;
      color: var(--muted);
      margin: 9px 0 0;
      line-height: 1.65;
      max-width: 650px
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn-primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 8px 18px #3f72e524
    }

    .btn-primary:hover {
      box-shadow: 0 11px 24px #3f72e538
    }

    .btn-dark {
      background: var(--navy);
      color: white
    }

    .btn-ghost {
      background: white;
      color: #4d5d77;
      border: 1px solid var(--line)
    }

    .btn-soft {
      background: var(--blue-soft);
      color: #315fbe
    }

    .btn-danger {
      background: var(--red-soft);
      color: var(--red)
    }

    .btn-sm {
      padding: 8px 11px;
      font-size: 10px;
      border-radius: 9px
    }

    .btn-block {
      width: 100%
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 23px;
      background: linear-gradient(115deg, #142e52 0%, #1d4572 62%, #327b97 100%);
      padding: 31px 31px 29px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 208px;
      gap: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 23px
    }

    .hero:before {
      content: "";
      position: absolute;
      width: 310px;
      height: 310px;
      right: 135px;
      top: -180px;
      border-radius: 50%;
      border: 1px solid #ffffff14;
      box-shadow: 0 0 0 36px #ffffff08, 0 0 0 76px #ffffff06
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -27px;
      bottom: -103px;
      border-radius: 50%;
      background: #5bd6d122
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 540px
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ffffff15;
      border: 1px solid #ffffff18;
      padding: 6px 9px;
      border-radius: 8px;
      color: #c7e5fa;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em
    }

    .hero h2 {
      font-size: 27px;
      line-height: 1.18;
      letter-spacing: -.04em;
      margin: 16px 0 10px;
      max-width: 460px
    }

    .hero p {
      color: #cad8e9;
      line-height: 1.65;
      font-size: 12px;
      margin: 0 0 19px;
      max-width: 420px
    }

    .hero-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap
    }

    .hero .btn-primary {
      background: #66dfd4;
      color: #0b3344;
      box-shadow: none
    }

    .hero .btn-ghost {
      background: #ffffff12;
      border-color: #ffffff2b;
      color: white
    }

    .hero-art {
      position: relative;
      z-index: 1;
      width: 210px;
      height: 160px;
      flex: none
    }

    .orbit {
      position: absolute;
      width: 142px;
      height: 142px;
      border: 1px solid #b6e3ff40;
      border-radius: 50%;
      top: 10px;
      left: 24px
    }

    .orbit:before,
    .orbit:after {
      content: "";
      position: absolute;
      border: 1px dashed #b6e3ff30;
      border-radius: 50%;
      inset: 14px
    }

    .orbit:after {
      inset: 29px
    }

    .book-illus {
      position: absolute;
      top: 34px;
      left: 51px;
      width: 88px;
      height: 90px;
      transform: rotate(-8deg)
    }

    .book-page {
      position: absolute;
      inset: 0;
      background: #f9fcff;
      border-radius: 9px 13px 13px 9px;
      box-shadow: 7px 8px 0 #0b234d50;
      clip-path: polygon(0 0, 100% 8%, 100% 100%, 0 91%)
    }

    .book-spine {
      position: absolute;
      left: 9px;
      top: 5px;
      bottom: 7px;
      width: 2px;
      background: #b6d4ec
    }

    .book-line {
      position: absolute;
      left: 22px;
      height: 4px;
      background: #c4d8ec;
      border-radius: 8px;
      width: 43px
    }

    .book-line.a {
      top: 24px
    }

    .book-line.b {
      top: 36px;
      width: 50px
    }

    .book-line.c {
      top: 48px;
      width: 37px
    }

    .book-line.d {
      top: 60px;
      width: 44px
    }

    .floating-check {
      position: absolute;
      top: 20px;
      right: 18px;
      width: 39px;
      height: 39px;
      background: #63dfd3;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #113753;
      box-shadow: 0 8px 22px #031c3a55;
      transform: rotate(10deg)
    }

    .floating-star {
      position: absolute;
      bottom: 19px;
      left: 19px;
      color: #ffd98a;
      font-size: 24px
    }

    .floating-dot {
      position: absolute;
      right: 24px;
      bottom: 23px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f8bd68;
      box-shadow: 0 0 0 8px #f8bd6817
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 25px
    }

    .stat-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 17px 18px;
      box-shadow: 0 5px 18px #213c5b04
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .stat-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--blue-soft);
      color: var(--blue)
    }

    .stat-icon.green {
      background: var(--green-soft);
      color: var(--green)
    }

    .stat-icon.amber {
      background: var(--amber-soft);
      color: var(--amber)
    }

    .stat-icon.purple {
      background: #f2eaff;
      color: #8453c5
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 650
    }

    .stat-number {
      font-size: 26px;
      letter-spacing: -.05em;
      font-weight: 850;
      color: #1a2b45
    }

    .stat-note {
      font-size: 10px;
      color: #8a95a8;
      margin-top: 6px
    }

    .section {
      margin-top: 25px
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px
    }

    .section-head h3 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.025em;
      color: #1b2d47
    }

    .section-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px
    }

    .text-link {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-weight: 800;
      font-size: 11px
    }

    .dash-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr);
      gap: 17px
    }

    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 19px;
      box-shadow: 0 5px 20px #24456a05;
      min-width: 0
    }

    .course-item {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid #edf0f6;
      border-radius: 13px;
      padding: 13px;
      margin-bottom: 10px
    }

    .course-item:last-child {
      margin-bottom: 0
    }

    .course-cover {
      width: 49px;
      height: 51px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      color: #295bb4;
      background: linear-gradient(145deg, #e1efff, #b9d9ff)
    }

    .course-cover.teal {
      background: linear-gradient(145deg, #d9fbf2, #a8e9dc);
      color: #147665
    }

    .course-cover.purple {
      background: linear-gradient(145deg, #f0e8ff, #d9c9ff);
      color: #6c4bb2
    }

    .course-body {
      flex: 1;
      min-width: 0
    }

    .course-title {
      font-size: 12px;
      font-weight: 800;
      color: #263853;
      margin-bottom: 5px
    }

    .course-meta {
      font-size: 10px;
      color: var(--muted)
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 11px
    }

    .progress {
      height: 6px;
      border-radius: 99px;
      background: #ecf0f6;
      overflow: hidden;
      flex: 1
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #4377ea, #55c8dc)
    }

    .progress-num {
      font-size: 10px;
      font-weight: 800;
      color: #60718c;
      white-space: nowrap
    }

    .mentor-mini-list {
      display: grid;
      gap: 10px
    }

    .mentor-mini {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 0;
      border-bottom: 1px solid #edf0f5
    }

    .mentor-mini:last-child {
      border-bottom: 0;
      padding-bottom: 0
    }

    .mentor-avatar {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 850;
      font-size: 12px;
      flex: none;
      background: #dbe8ff;
      color: #315ca0
    }

    .mentor-avatar.green {
      background: #d7f5e9;
      color: #167257
    }

    .mentor-avatar.pink {
      background: #ffe4ed;
      color: #a84467
    }

    .mentor-avatar.gold {
      background: #fff0ce;
      color: #9b6b1d
    }

    .mentor-avatar.purple {
      background: #ece3ff;
      color: #7655ae
    }

    .mentor-mini-main {
      flex: 1;
      min-width: 0
    }

    .mentor-mini-name {
      font-size: 11px;
      font-weight: 800;
      color: #263853;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap
    }

    .mentor-mini-meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .rating {
      font-size: 10px;
      color: #a96d11;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 800
    }

    .verified {
      font-size: 9px;
      color: #168567;
      background: #e5f7ef;
      padding: 4px 6px;
      border-radius: 6px;
      font-weight: 850;
      white-space: nowrap
    }

    .chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      font-size: 10px;
      color: #50617c;
      background: #f0f3f8;
      padding: 6px 8px;
      border-radius: 7px;
      font-weight: 700
    }

    .chip.blue {
      background: #edf3ff;
      color: #3b63b5
    }

    .chip.green {
      background: #e5f7ef;
      color: #177759
    }

    .chip.amber {
      background: #fff2dc;
      color: #996317
    }

    .empty {
      border: 1px dashed #d7deea;
      border-radius: 14px;
      padding: 26px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7
    }

    .empty strong {
      display: block;
      color: #344761;
      margin-bottom: 5px
    }

    .filterbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: white;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 17px
    }

    .field-search {
      flex: 1;
      min-width: 190px;
      position: relative
    }

    .field-search input {
      padding-left: 37px
    }

    .field-search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8591a5
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid #dfe5ee;
      background: white;
      color: #2a3b54;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 12px;
      outline: none;
      transition: border .15s, box-shadow .15s
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: #8babf8;
      box-shadow: 0 0 0 3px #3f72e512
    }

    .input::placeholder,
    .textarea::placeholder {
      color: #9ba6b7
    }

    .filterbar .select {
      width: auto;
      min-width: 144px;
      padding: 10px 12px
    }

    .check-filter {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #5e6d84;
      font-weight: 700;
      white-space: nowrap
    }

    .check-filter input {
      accent-color: var(--blue)
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 7px 2px 13px;
      color: var(--muted);
      font-size: 11px
    }

    .mentor-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px
    }

    .mentor-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;

      margin-top: 16px

    .modal-backdrop {

    .profile-metric strong {

    .toast {

    .toast-mark {

      height: 20px;
      border-radius: 7px;

    .mobile-menu {

    .small-label {

      text-transform: uppercase;
      color: #8b98ad;
      font-weight: 850
    }

    .footer-note {

      color: #9aa5b5;
      line-height: 1.6;
      margin-top: 19px
    }

    .number-badge {

      height: 20px;

      background: #edf3ff;

      font-size: 9px;
      font-weight: 850;

    }

    .inline-link {

      background: transparent;
      color: #3f72e5;
      font-size: 10px;
      font-weight: 800;
      padding: 0
    }

    .hidden {
      display: none !important
    }

    @media(max-width:1180px) {

        grid-template-columns: repeat(2, minmax(0, 1fr))

        grid-template-columns: repeat(2, minmax(0, 1fr))

      .hero-art {

      .content {

        padding-right: 25px
      }

      .topbar {
        padding: 0 25px

    }

    @media(max-width:850px) {
      .sidebar {
        width: 72px;
        padding: 20px 9px

      .brand {
        padding: 0 7px 25px

      .brand-name,
      .brand-sub,
      .nav-label,
      .nav-btn .nav-text,
      .nav-count,
      .pilot-card,
      .user-mini .mini-info {
        display: none
      }

      .brand-mark {
        width: 42px;
        height: 42px
      }

      .nav-btn {
        justify-content: center;
        padding: 0
      }

      .nav-btn svg {
        width: 20px;
        height: 20px
      }

      .user-mini {
        justify-content: center;
        padding: 15px 0 0
      }

      .user-mini .avatar {
        width: 38px;
        height: 38px
      }

      .main {
        width: calc(100% - 72px);
        margin-left: 72px
      }

      .dash-grid,
      .request-layout {
        grid-template-columns: 1fr
      }

      .hero-art {
        display: none
      }

      .topbar {
        padding: 0 18px
      }

      .content {
        padding: 24px 18px 42px
      }

      .crumb {
        font-size: 10px
      }

      .demo-tag {
        display: none
      }
    }

    @media(max-width:580px) {
      .topbar {
        height: 65px
      }

      .content {
        padding: 20px 13px 35px
      }

      .page-head {
        display: block
      }

      .page-head .btn {
        margin-top: 15px
      }

      .page-head h1 {
        font-size: 24px
      }

      .hero {
        padding: 23px 20px;

      .hero h2 {
        font-size: 23px
      }

      .hero p {
        font-size: 11px
      }

      .stats-grid {
        gap: 9px
      }

      .stat-card {
        padding: 14px
      }

      .stat-number {
        font-size: 23px
      }

      .mentor-grid,

        grid-template-columns: 1fr
      }

      .filterbar .select {
        flex: 1;
        min-width: 120px
      }

      .form-grid {

      }

      .form-group.full {
        grid-column: auto
      }

      .list-card {
        padding: 13px
      }

      .list-card>.mentor-avatar {
        width: 38px;
        height: 38px
      }

      .modal-backdrop {
        padding: 9px
      }

      .modal-header,
      .modal-body {
        padding-left: 17px;
        padding-right: 17px
      }

      .mode-switch {
        padding: 8px;
        font-size: 10px
      }

      .top-right {
        gap: 7px
      }

      .icon-btn {
        width: 33px;
        height: 33px
      }

      .page-tabs {
        max-width: 100%;

      }

      .tab-btn {

        padding: 9px 10px
      }

      .profile-metrics {
        gap: 6px
      }

      .profile-metric {
        padding: 10px
      }

      .profile-metric strong {
        font-size: 15px
      }
    }
  </style>
</head>

    function wirePage() {
      document.querySelectorAll('[data-page-jump]').forEach(b => b
        .addEventListener('click', () => go(b.dataset.pageJump)));
      document.querySelectorAll('[data-action]').forEach(b => b
        .addEventListener('click', () => handleAction(b.dataset.action, b
          .dataset.id, b.dataset)));
      if (page === 'mentors') {
        const q = document.getElementById('mentor-query');
        q.addEventListener('input', () => {
          mentorFilters.query = q.value;
          const pos = q.selectionStart;
          render();
          const inp = document.getElementById('mentor-query');
          inp.focus();
          inp.setSelectionRange(pos, pos)
        });
        document.getElementById('mentor-subject').addEventListener('change',
          e => {
            mentorFilters.subject = e.target.value;
            render()
          });
        document.getElementById('mentor-mode').addEventListener('change', e => {
          mentorFilters.mode = e.target.value;
          render()
        });
        document.getElementById('mentor-verified').addEventListener('change',
          e => {
            mentorFilters.verified = e.target.checked;
            render()
          })
      }
      document.querySelectorAll('[data-learning-tab]').forEach(b => b
        .addEventListener('click', () => {
          document.querySelectorAll('[data-learning-tab]').forEach(x => x
            .classList.toggle('active', x === b));
          document.getElementById('learning-tab-content').innerHTML = b
            .dataset.learningTab === 'courses' ? renderLearningCourses() :
            renderLearningRequests();
          document.querySelectorAll('#learning-tab-content [data-action]')
            .forEach(x => x.addEventListener('click', () => handleAction(x
              .dataset.action, x.dataset.id, x.dataset)));
        }));
      document.querySelectorAll('[data-request-tab]').forEach(b => b
        .addEventListener('click', () => {
          document.querySelectorAll('[data-request-tab]').forEach(x => x
            .classList.toggle('active', x === b));
          document.getElementById('request-list').innerHTML =
            renderRequestTab(b.dataset.requestTab);
          document.querySelectorAll('#request-list [data-action]').forEach(
            x => x.addEventListener('click', () => handleAction(x.dataset
              .action, x.dataset.id, x.dataset)));
        }));
    }

    function handleAction(action, id, data = {}) {
      if (action === 'mentor-detail') return openMentor(id);
      if (action === 'request-mentor') return openRequestForm(id);
      if (action === 'request-general') return openRequestForm(null);
      if (action === 'open-course') return openCourse(id);
      if (action === 'open-request-course') {
        const c = state.courses.find(c => c.requestId === id);
        if (c) return openCourse(c.id);
        showToast('Learning plan belum tersedia');
        return
      }
      if (action === 'toggle-module') {
        const c = state.courses.find(c => c.id === data.course);
        if (!c) return;
        const i = Number(data.index),
          pos = c.doneModules.indexOf(i);
        if (pos >= 0) c.doneModules.splice(pos, 1);
        else c.doneModules.push(i);
        saveState();
        render();
        showToast('Progress modul diperbarui');
        return
      }
      if (action === 'accept-request') {
        const r = state.requests.find(r => r.id === id);
        if (r) {
          r.status = 'confirmed';
          if (r.type === 'Full Course' && !state.courses.some(c => c
              .requestId === r.id)) {
            const modules = modulesFor(r.subject, r.topic);
            state.courses.push({
              id: 'c-' + Date.now(),
              requestId: r.id,
              title: r.subject + ' Learning Path',
              subject: r.subject,
              mentorId: r.mentorId,
              mentorName: getMentor(r.mentorId).name,
              type: 'Full Course',
              doneModules: [],
              modules
            });
          }
          saveState();
          render();
          showToast(r.type === 'Full Course' ?
            'Request diterima · learning plan dibuat' : 'Request dikonfirmasi'
            )
        }
        return
      }
      if (action === 'reject-request') {
        const r = state.requests.find(r => r.id === id);
        if (r) {
          r.status = 'rejected';
          saveState();
          render();
          showToast('Request ditolak')
        }
        return
      }
      if (action === 'cancel-request') {
        const r = state.requests.find(r => r.id === id);
        if (r) {
          r.status = 'cancelled';
          saveState();
          render();
          showToast('Request dibatalkan')
        }
        return
      }
      if (action === 'complete-request') {
        const r = state.requests.find(r => r.id === id);
        if (r) {
          r.status = 'completed';
          if (!r.summary) r.summary =
            'Sesi selesai. Tambahkan poin yang telah dipahami dan latihan lanjutan.';
          saveState();
          render();
          showToast('Sesi ditandai selesai')
        }
        return
      }
      if (action === 'leave-review') return openReview(id);
      if (action === 'session-notes') return openSessionNotes(id);
      if (action === 'edit-profile') return openEditProfile();
    }

    function openModal(html, wide = false) {
      const back = document.getElementById('modal-backdrop'),
        m = document.getElementById('modal');
      m.className = 'modal' + (wide ? ' wide' : '');
      m.innerHTML = html;
      back.classList.add('open');
      back.onclick = e => {
        if (e.target === back) closeModal()
      };
      m.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener(
        'click', closeModal));
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open')
    }

    function openMentor(id) {
      const m = getMentor(id);
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">MENTOR PROFILE</div><h2>Kenali mentor sebelum memilih</h2><p>Informasi profil untuk mendukung keputusan learner.</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><div class="profile-head"><div class="mentor-avatar ${m.color||''}">${esc(m.initials)}</div><div><div class="profile-name">${esc(m.name)}</div><div class="profile-role">${esc(m.major)}</div><div class="chips" style="margin-top:8px">${m.verified?'<span class="verified">✓ Verified* (demo)</span>':'<span class="chip amber">Belum terverifikasi</span>'}<span class="rating">★ ${m.rating.toFixed(1)} (${m.reviews} ulasan contoh)</span></div></div></div><div class="profile-metrics"><div class="profile-metric"><strong>${esc(m.experience.split(' ')[0])}</strong><span>Sesi selesai*</span></div><div class="profile-metric"><strong>${esc(m.mode.join(' / '))}</strong><span>Mode pembelajaran</span></div><div class="profile-metric"><strong>${m.topics.length}</strong><span>Topik ditawarkan</span></div></div><div class="form-group"><label>Tentang mentor</label><p style="font-size:12px;color:#687891;line-height:1.8;margin:0">${esc(m.bio)}</p></div><div class="form-group" style="margin-top:15px"><label>Subject expertise</label><div class="chips">${m.subjects.map(s=>`<span class="chip blue">${esc(s)}</span>`).join('')}</div></div><div class="form-group" style="margin-top:15px"><label>Topik yang dapat diajarkan</label><div class="chips">${m.topics.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div><div class="form-group" style="margin-top:15px"><label>Ketersediaan yang disampaikan</label><div class="list-meta">${esc(m.availability)}</div></div><div class="form-group" style="margin-top:15px"><label>Ulasan</label><div class="notice">Ulasan di profil ini merupakan data demonstrasi, bukan testimoni pengguna nyata. Di produk yang sesungguhnya, ulasan hanya dapat dibuat setelah sesi tercatat selesai.</div></div><div class="modal-actions"><button class="btn btn-ghost" data-close-modal>Tutup</button><button class="btn btn-primary" id="modal-request">Buat learning request ${icon('arrow',14)}</button></div></div>`,
        true);
      document.getElementById('modal-request').addEventListener('click', () =>
        openRequestForm(id));
    }

    function openRequestForm(mentorId) {
      if (state.role !== 'learner') {
        showToast('Ganti ke mode Learner untuk membuat request');
        return
      }
      const m = mentorId ? getMentor(mentorId) : null;
      requestType = 'Single Session';
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">LEARNING REQUEST</div><h2>Jelaskan kebutuhan belajarmu</h2><p>Request yang spesifik membantu mentor menyiapkan sesi yang lebih relevan.</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><form id="request-form"><div class="form-grid"><div class="form-group full"><label>Mentor pilihan</label><select class="select" name="mentorId" required>${m?`<option value="${m.id}">${esc(m.name)} · ${esc(m.subjects.join(', '))}</option>`:`<option value="">Pilih mentor</option>`+state.mentors.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.subjects.join(', '))}</option>`).join('')}</select><div class="form-hint">Pemilihan dilakukan oleh learner, bukan sistem otomatis.</div></div><div class="form-group"><label>Subject</label><select class="select" name="subject" required>${(m?m.subjects:[...new Set(state.mentors.flatMap(x=>x.subjects))].sort()).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="form-group"><label>Topik spesifik</label><input class="input" name="topic" required placeholder="Contoh: Hypothesis Testing"/></div><div class="form-group full"><label>Jenis pembelajaran</label><div class="radio-row"><label class="radio-option"><input type="radio" name="type" value="Single Session" checked/><span>Single Session<br><small style="font-size:9px;font-weight:500">Satu kebutuhan spesifik</small></span></label><label class="radio-option"><input type="radio" name="type" value="Full Course"/><span>Full Course<br><small style="font-size:9px;font-weight:500">Beberapa sesi terstruktur</small></span></label></div></div><div class="form-group full"><label>Tujuan belajar</label><textarea class="textarea" name="objective" required placeholder="Apa yang ingin kamu pahami setelah sesi?" rows="3"></textarea></div><div class="form-group"><label>Tanggal pilihan</label><input class="input" name="date" type="date" min="${localIsoDate(0)}" value="${localIsoDate(3)}" required/></div><div class="form-group"><label>Waktu pilihan</label><input class="input" name="time" type="time" value="16:00" required/></div><div class="form-group"><label>Durasi</label><select class="select" name="duration"><option>60 menit</option><option selected>90 menit</option><option>120 menit</option></select></div><div class="form-group"><label>Mode</label><select class="select" name="mode"><option>Offline</option><option>Online</option></select></div><div class="form-group full"><label>Lokasi / link pertemuan</label><input class="input" name="location" placeholder="Contoh: area belajar kampus atau Google Meet" value="Area belajar kampus"/></div><div class="form-group full"><label>Catatan tambahan</label><textarea class="textarea" name="notes" rows="2" placeholder="Tingkat pemahaman saat ini, materi yang sudah dicoba, atau kebutuhan khusus."></textarea></div><div class="form-group full" id="course-week-group" style="display:none"><label>Perkiraan struktur Full Course</label><div class="notice">Untuk prototype, Full Course dibuat sebagai request. Rencana sesi dan modul dapat disepakati bersama mentor setelah request diterima.</div></div></div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Batal</button><button class="btn btn-primary" type="submit">Kirim learning request ${icon('arrow',14)}</button></div></form></div>`,
        true);
      const form = document.getElementById('request-form');
      form.querySelectorAll('input[name="type"]').forEach(r => r
        .addEventListener('change', () => {
          document.getElementById('course-week-group').style.display = form
            .querySelector('input[name="type"]:checked').value ===
            'Full Course' ? 'block' : 'none'
        }));
      form.elements.mentorId.addEventListener('change', () => {
        const sel = getMentor(form.elements.mentorId.value);
        form.elements.subject.innerHTML = sel.subjects.map(s =>
          `<option>${esc(s)}</option>`).join('')
      });
      form.addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(form);
        const mentor = getMentor(fd.get('mentorId'));
        const req = {
          id: 'req-' + Date.now(),
          learner: state.user.name,
          learnerInitials: state.user.initials,
          mentorId: mentor.id,
          subject: fd.get('subject'),
          topic: fd.get('topic').trim(),
          objective: fd.get('objective').trim(),
          type: fd.get('type'),
          week: fd.get('type') === 'Full Course' ?
            'Learning plan to be agreed' : 'Specific topic',
          date: fd.get('date'),
          time: fd.get('time'),
          duration: fd.get('duration'),
          mode: fd.get('mode'),
          location: fd.get('location').trim(),
          notes: fd.get('notes').trim(),
          status: 'pending',
          createdAt: new Date().toISOString(),
          demo: false
        };
        state.requests.unshift(req);
        saveState();
        closeModal();
        go('requests');
        showToast('Learning request berhasil dikirim');
      });
    }

    function openCourse(id) {
      const c = state.courses.find(x => x.id === id) || state.courses[0];
      if (!c) return;
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">LEARNING MODULE</div><h2>${esc(c.title)}</h2><p>${esc(c.mentorName)} · ${c.modules.length} modul · Full Course demo</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><div class="progress-row" style="margin-bottom:18px"><div class="progress"><span style="width:${Math.round(c.doneModules.length/c.modules.length*100)}%"></span></div><div class="progress-num">${c.doneModules.length}/${c.modules.length} selesai</div></div><div class="module-list">${c.modules.map((m,i)=>`<div class="module-row"><button class="module-check ${c.doneModules.includes(i)?'done':''}" data-modal-module="${i}">${c.doneModules.includes(i)?icon('check',14):''}</button><div class="module-info"><div class="module-title">Week ${i+1} · ${esc(m.title)}</div><div class="module-sub">${esc(m.sub)}</div></div><span class="module-lock">${c.doneModules.includes(i)?'Selesai':'Belum'}</span></div>`).join('')}</div><div class="notice" style="margin-top:16px">Tandai modul selesai setelah kamu benar-benar mempelajari topiknya. Progress dalam demo disimpan di browser ini.</div><div class="modal-actions"><button class="btn btn-primary" data-close-modal>Selesai</button></div></div>`,
        true);
      document.querySelectorAll('[data-modal-module]').forEach(b => b
        .addEventListener('click', () => {
          const i = Number(b.dataset.modalModule),
            at = c.doneModules.indexOf(i);
          if (at >= 0) c.doneModules.splice(at, 1);
          else c.doneModules.push(i);
          saveState();
          openCourse(id)
        }));
    }

    function openReview(id) {
      const r = state.requests.find(x => x.id === id);
      if (!r) return;
      selectedRating = 5;
      reviewRequestId = id;
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">LEARNER FEEDBACK</div><h2>Bagaimana sesi belajarnya?</h2><p>Ulasan hanya diberikan setelah sesi selesai dan membantu learner lain mengambil keputusan.</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><div class="list-title">${esc(r.topic)} · ${esc(getMentor(r.mentorId).name)}</div><div class="review-stars" style="margin:15px 0 19px">${[1,2,3,4,5].map(n=>`<button type="button" class="star-btn ${n<=selectedRating?'active':''}" data-star="${n}">★</button>`).join('')}</div><form id="review-form"><div class="form-group"><label>Ulasan</label><textarea class="textarea" name="comment" required placeholder="Apa yang membantu? Adakah hal yang bisa diperbaiki?" rows="4"></textarea></div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Batal</button><button class="btn btn-primary" type="submit">Kirim ulasan</button></div></form></div>`
        );
      document.querySelectorAll('[data-star]').forEach(b => b.addEventListener(
        'click', () => {
          selectedRating = Number(b.dataset.star);
          document.querySelectorAll('[data-star]').forEach(x => x.classList
            .toggle('active', Number(x.dataset.star) <= selectedRating))
        }));
      document.getElementById('review-form').addEventListener('submit', e => {
        e.preventDefault();
        const comment = new FormData(e.target).get('comment').trim();
        state.reviews.push({
          id: 'rev-' + Date.now(),
          requestId: id,
          rating: selectedRating,
          comment,
          createdAt: new Date().toISOString()
        });
        r.status = 'reviewed';
        const m = getMentor(r.mentorId);
        m.reviews += 1;
        m.rating = Number(((m.rating * (m.reviews - 1) + selectedRating) / m
          .reviews).toFixed(1));
        saveState();
        closeModal();
        render();
        showToast('Terima kasih atas feedback-mu');
      });
    }

    function openSessionNotes(id) {
      const r = state.requests.find(x => x.id === id);
      if (!r) return;
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">SESSION RECORD</div><h2>Catatan sesi</h2><p>${esc(r.topic)} · ${formatDate(r.date)}</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><form id="notes-form"><div class="form-group"><label>Ringkasan sesi / materi yang dibahas</label><textarea class="textarea" name="summary" rows="4" placeholder="Konsep utama, contoh yang dibahas, dan hal yang sudah dipahami...">${esc(r.summary||'')}</textarea></div><div class="form-group" style="margin-top:14px"><label>Langkah belajar berikutnya</label><textarea class="textarea" name="next" rows="3" placeholder="Latihan atau materi lanjutan...">${esc(r.next||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Tutup</button><button class="btn btn-primary" type="submit">Simpan catatan</button></div></form></div>`
        );
      document.getElementById('notes-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        r.summary = fd.get('summary').trim();
        r.next = fd.get('next').trim();
        saveState();
        closeModal();
        showToast('Catatan sesi disimpan');
      });
    }

    function openEditProfile() {
      const m = getMentor('m1');
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">MENTOR SETTINGS</div><h2>Edit profil mentor</h2><p>Perubahan hanya disimpan di browser pada prototype ini.</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><form id="profile-form"><div class="form-grid"><div class="form-group full"><label>Nama</label><input class="input" name="name" value="${esc(m.name)}" required></div><div class="form-group full"><label>Program studi / angkatan</label><input class="input" name="major" value="${esc(m.major)}" required></div><div class="form-group full"><label>Subject (pisahkan dengan koma)</label><input class="input" name="subjects" value="${esc(m.subjects.join(', '))}" required></div><div class="form-group full"><label>Topik (pisahkan dengan koma)</label><input class="input" name="topics" value="${esc(m.topics.join(', '))}" required></div><div class="form-group full"><label>Tentang saya</label><textarea class="textarea" name="bio" rows="3" required>${esc(m.bio)}</textarea></div><div class="form-group"><label>Ketersediaan</label><input class="input" name="availability" value="${esc(m.availability)}" required></div><div class="form-group"><label>Mode pembelajaran</label><select class="select" name="mode"><option ${m.mode.includes('Online')?'selected':''}>Online</option><option ${m.mode.includes('Offline')?'selected':''}>Offline</option></select></div></div><div class="notice" style="margin-top:14px">Untuk aplikasi produksi, satu akun dapat menjadi learner maupun mentor. Profil asli harus terikat pada akun terautentikasi, bukan ke profil demo ini.</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-close-modal>Batal</button><button type="submit" class="btn btn-primary">Simpan perubahan</button></div></form></div>`
        );
      document.getElementById('profile-form').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        m.name = fd.get('name').trim();
        m.initials = initials(m.name);
        m.major = fd.get('major').trim();
        m.subjects = fd.get('subjects').split(',').map(s => s.trim())
          .filter(Boolean);
        m.topics = fd.get('topics').split(',').map(s => s.trim()).filter(
          Boolean);
        m.bio = fd.get('bio').trim();
        m.availability = fd.get('availability').trim();
        m.mode = [fd.get('mode')];
        saveState();
        closeModal();
        updateUserUi();
        render();
        showToast('Profil mentor diperbarui');
      });
    }

    function showAbout() {
      openModal(
        `<div class="modal-header"><div><div class="eyebrow">ABOUT THIS BUILD</div><h2>LINKED · Prototype V1</h2><p>Teach What You Know. Learn What You Need.</p></div><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><div class="notice"><strong>Mode demo:</strong> aplikasi berjalan di browser dan menyimpan perubahan pada localStorage perangkat ini. Profil, rating, jadwal, dan ulasan yang sudah ada adalah data contoh.</div><div class="divider"></div><div class="steps"><div class="step"><div class="step-num">1</div><div><div class="step-title">Coba sebagai learner</div><div class="step-text">Cari mentor, buka profil, buat request, kemudian lihat statusnya di Learning requests.</div></div></div><div class="step"><div class="step-num">2</div><div><div class="step-title">Ganti ke mode mentor</div><div class="step-text">Gunakan tombol di pojok kanan atas untuk menerima/menolak request, menandai sesi selesai, dan menulis catatan.</div></div></div><div class="step"><div class="step-num">3</div><div><div class="step-title">Coba learning progress</div><div class="step-text">Buka My learning dan tandai modul sebagai selesai. Perubahan akan tersimpan selama data browser tidak dihapus.</div></div></div></div><div class="divider"></div><div class="small-label">Belum termasuk</div><p class="list-meta" style="line-height:1.9">Login aman, database multi-user, email notification, payment gateway, moderator/admin console, real mentor verification, dan data acara live. File supabase_schema.sql disertakan sebagai dasar tahap integrasi berikutnya.</p><div class="modal-actions"><button class="btn btn-primary" data-close-modal>Mulai eksplorasi</button></div></div>`
        );
    }

    function localIsoDate(offset = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
    }

    function formatDate(s) {
      if (!s) return 'Tanggal belum ditentukan';
      const d = new Date(s + 'T12:00:00');
      return d.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      })
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      t.classList.add('show');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => t.classList.remove('show'), 2600)
    }
    // The demo learner is distinct from the seeded mentor to avoid self-booking.
    render();
  </script>
</body>

</html>
